<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Login gate: shown until a valid Supabase session exists -->
    <div class="converter-card" id="login-screen">
        <h2>Sign In</h2>

        <div class="input-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="username">
        </div>

        <div class="input-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password">
        </div>

        <button id="login-btn">Log In</button>

        <p class="link-row"><a href="#" id="forgot-password-link">Forgot password?</a></p>

        <div class="result-box" id="login-error" style="display:none;">
            <p id="login-error-text"></p>
        </div>
    </div>

    <!-- Forgot password: request a reset email -->
    <div class="converter-card" id="forgot-password-screen" style="display:none;">
        <h2>Reset Password</h2>

        <div class="input-group">
            <label for="reset-email">Email</label>
            <input type="email" id="reset-email" autocomplete="username">
        </div>

        <button id="send-reset-btn">Send Reset Link</button>

        <p class="link-row"><a href="#" id="back-to-login-link">Back to log in</a></p>

        <div class="result-box" id="reset-request-msg" style="display:none;">
            <p id="reset-request-msg-text"></p>
        </div>
    </div>

    <!-- Set new password: shown after clicking the emailed reset link -->
    <div class="converter-card" id="new-password-screen" style="display:none;">
        <h2>Set New Password</h2>

        <div class="input-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" autocomplete="new-password">
        </div>

        <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" autocomplete="new-password">
        </div>

        <button id="save-new-password-btn">Save Password</button>

        <div class="result-box" id="new-password-msg" style="display:none;">
            <p id="new-password-msg-text"></p>
        </div>
    </div>

    <!-- App content: hidden until login succeeds -->
    <div class="converter-card" id="app-content" style="display:none;">
        <div class="app-header">
            <h2>Currency Converter</h2>
            <button id="logout-btn" title="Log Out">Log Out</button>
        </div>

        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" value="1" min="1">
        </div>

        <div class="selection-group">
            <div class="select-box">
                <label for="from-currency">From</label>
                <select id="from-currency"></select>
            </div>

            <button id="swap-btn" title="Swap Currencies">⇆</button>

            <div class="select-box">
                <label for="to-currency">To</label>
                <select id="to-currency"></select>
            </div>
        </div>

        <button id="convert-btn">Convert</button>

        <div class="result-box">
            <p id="result-text">Fetching latest rates...</p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
