<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Currency Converter</title>
    <script>
        (function () {
            var savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle theme">🌙</button>

    <div class="converter-card wide" id="dashboard-card">
        <div class="app-header">
            <div>
                <h2>Dashboard</h2>
                <p id="user-greeting" class="user-greeting"></p>
            </div>
            <div class="header-actions">
                <a href="index.html" class="ghost-btn" title="Back to Converter">← Converter</a>
                <button id="logout-btn" title="Log Out">Log Out</button>
            </div>
        </div>

        <div id="dashboard-loading" class="dashboard-loading">Loading your stats...</div>

        <div id="dashboard-body" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">Total Conversions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-favorite-pair">—</div>
                    <div class="stat-label">Most Used Pair</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-favorite-currency">—</div>
                    <div class="stat-label">Most Used Currency</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-last-conversion">—</div>
                    <div class="stat-label">Last Conversion</div>
                </div>
            </div>

            <div class="section-title">Recent Conversions</div>
            <div class="history-table-wrap">
                <table class="history-table" id="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Result</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- rows injected by dashboard.js -->
                    </tbody>
                </table>
            </div>

            <div id="dashboard-empty" class="empty-state" style="display:none;">
                No conversions yet. Head back to the converter and make your first one!
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="supabase-client.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
